name: mimir2
# looped: repeat a single-stream [L x L_cycles, H] block H_cycles times.
recurrence_mode: hierarchical
H_cycles: 2
L_cycles: 3
half_layers: true
bp_min_steps: 2
H_override: {}
bp_max_steps: 5
bp_warmup_ratio: 0.2
goldfish_strategy: null
goldfish_k: 50
goldfish_context_width: 50
goldfish_seed: 0
gate_alpha_max: 1.0
gate_warmup_start_step: 0
gate_warmup_steps: 2000
gate_initialize_from_v1: false
gates_enabled: false
# Reference implementation: all experts execute; top-k masks contributions.
moe_num_experts: 1
moe_top_k: 1
moe_levels: L
mos_num_experts: 1
mos_top_k: 1
mos_state_mode: shared
expert_freeze_base: false
router_top1_straight_through: true
# Multiple residual streams within a stack; one attention/MLP execution per layer.
residual_branches: 1
residual_levels: both
residual_alpha_max: 1.0
residual_warmup_start_step: 0
residual_warmup_steps: 0
residual_write_init_scale: 0.1
residual_input_dependent: false
h_residual_persistence: false
h_branch_l_mixing: false
upcycle_from_dense: false
moe_sparse: false
mos_sparse: false
mos_sparse_routing: first_token
h_memory_branches: 1
l_memory_branches: 1
memory_warmup_steps: 2000
memory_warmup_start_step: 0
ngram_orders: []
ngram_buckets: 4096
ngram_heads: 1
ngram_contextual_gate: false
ngram_warmup_steps: 2000
ngram_warmup_start_step: 0
moe_metadata_bias: []
mos_metadata_bias: []
routing_bias_decay_start: 0
routing_bias_decay_end: 0
specialist_training: false
specialist_router_calibration: false

moe_aux_loss_free: false
mos_aux_loss_free: false
routing_bias_update_rate: 0.001
