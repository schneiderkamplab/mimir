[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mimir"
version = "0.1.0"
description = "Mimir2 training, export, evaluation and scheduling"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
dependencies = ["typer>=0.16,<1", "rich>=13,<16", "pydantic>=2.11,<3", "hydra-core==1.3.2", "numpy>=2,<3", "PyYAML>=6,<7", "psutil>=7,<8"]

[project.optional-dependencies]
sm100 = ["flash-attn-4[cu13] @ git+https://github.com/Dao-AILab/flash-attention.git@4178915405522cb161ece80005e882c7465693b7#subdirectory=flash_attn/cute"]
training = ["torch==2.11.0", "einops>=0.8,<1", "numba>=0.61,<1", "tqdm>=4.67,<5", "coolname>=2,<6", "psutil>=7,<8"]
serving = ["safetensors>=0.6,<1", "transformers @ git+https://github.com/huggingface/transformers.git@4c414256ddce7b3c896cb624d55d1299ad963d20", "vllm==0.23.1rc1.dev102+ga46abb7ae"]
evaluation = ["inspect-ai==0.3.252", "inspect-evals==0.16.0", "euroeval==17.7.0", "bert-score==0.3.13", "math-verify>=0.8,<1", "sacrebleu>=2.5,<3", "datasets>=4,<5"]
wandb = ["wandb>=0.21,<1"]
test = ["pytest>=8,<10"]

[project.scripts]
mimir = "mimir.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mimir = ["conf/**/*.yaml", "evaluation/suites/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-version = "==0.13.3"
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
vllm = { index = "vllm-qualified" }

[[tool.uv.index]]
name = "vllm-qualified"
url = "https://wheels.vllm.ai/a46abb7ae68acc13a4fc5870db98619b3f97c6e0/cu130"
explicit = true
